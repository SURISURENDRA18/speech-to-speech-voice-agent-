<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Pipeline: microphone, Silero VAD, Whisper, Qwen3, Indic normalization, Svara TTS, speaker">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1020"/>
    <stop offset="0.55" stop-color="#1A1442"/>
    <stop offset="1" stop-color="#0C2A44"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="0.5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>

  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="330" rx="22"/></clipPath>
</defs>
<style>
  .box { fill: #121A33; stroke: #2A3560; stroke-width: 1.5; }
  .lit { fill: none; stroke: url(#accent); stroke-width: 3; opacity: 0; animation: lit 5.0s linear infinite; }
  @keyframes lit { 0% { opacity: 0 } 4% { opacity: 1 } 16% { opacity: 1 } 24% { opacity: 0 } 100% { opacity: 0 } }
  .num { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B5CF6; }
  .bt { font: 700 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #F1F5F9; }
  .bs { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #94A3C4; }
  .chip { fill: #0F2236; stroke: #1E4A63; }
  .ct { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #67E8F9; }
  .wire { stroke: #2A3560; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12 } }
  .end { fill: #121A33; stroke: url(#accent); stroke-width: 2.5; }
  .lbl { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #A5B4D4; }
  .h { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #E2E8F0; letter-spacing: 2px; }
  .barge { fill: none; stroke: #F43F5E; stroke-width: 2; stroke-dasharray: 5 7; animation: flow2 1.4s linear infinite; }
  @keyframes flow2 { to { stroke-dashoffset: 24 } }
  .bl { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #FDA4AF; }
  .wave { fill: none; stroke: #67E8F9; stroke-width: 2.5; stroke-linecap: round; animation: pulse 1s ease-in-out infinite alternate; }
  .wave.w2 { animation-delay: .3s }
  @keyframes pulse { from { opacity: .25 } to { opacity: 1 } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="330" fill="url(#bg)"/>
  <text class="h" x="40" y="44">HOW A TURN FLOWS</text>
  <text class="lbl" x="1240" y="44" text-anchor="end">target: ~0.8–1.2 s to first audio on one NVIDIA L4</text>

  <line class="wire" x1="112" y1="170" x2="1168" y2="170"/>

  <path class="barge" d="M 70 124 C 70 30, 1030 30, 1030 114.0"/>
  <text class="bl" x="560" y="96" text-anchor="middle">barge-in: new speech cancels the LLM + TTS instantly</text>

  <circle class="end" cx="70" cy="170" r="42"/>
  <rect x="61" y="148" width="18" height="30" rx="9" fill="#67E8F9"/>
  <path d="M52 168 a18 18 0 0 0 36 0" fill="none" stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="70" y1="186" x2="70" y2="194" stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round"/>
  <text class="lbl" x="70" y="242" text-anchor="middle">you speak</text>

  <circle class="end" cx="1210" cy="170" r="42"/>
  <path d="M1188 160 h10 l14 -12 v44 l-14 -12 h-10 z" fill="#67E8F9"/>
  <path class="wave" d="M1220 161 q8 9 0 18"/>
  <path class="wave w2" d="M1227 154 q14 16 0 32"/>
  <text class="lbl" x="1210" y="242" text-anchor="middle">agent replies</text>

  
  <g>
    <rect class="box" x="166.0" y="118.0" width="168" height="104" rx="16"/>
    <rect class="lit" x="166.0" y="118.0" width="168" height="104" rx="16" style="animation-delay:0.28s"/>
    <text class="num" x="182.0" y="142.0">01</text>
    <text class="bt" x="250" y="174" text-anchor="middle">Silero VAD</text>
    <text class="bs" x="250" y="198" text-anchor="middle">detects end of turn</text>
    <rect class="chip" x="188" y="238.0" width="124" height="26" rx="13"/>
    <text class="ct" x="250" y="255.5" text-anchor="middle">~300 ms silence</text>
  </g>
  <g>
    <rect class="box" x="361.0" y="118.0" width="168" height="104" rx="16"/>
    <rect class="lit" x="361.0" y="118.0" width="168" height="104" rx="16" style="animation-delay:0.97s"/>
    <text class="num" x="377.0" y="142.0">02</text>
    <text class="bt" x="445" y="174" text-anchor="middle">Whisper</text>
    <text class="bs" x="445" y="198" text-anchor="middle">large-v3-turbo STT</text>
    <rect class="chip" x="383" y="238.0" width="124" height="26" rx="13"/>
    <text class="ct" x="445" y="255.5" text-anchor="middle">150–300 ms</text>
  </g>
  <g>
    <rect class="box" x="556.0" y="118.0" width="168" height="104" rx="16"/>
    <rect class="lit" x="556.0" y="118.0" width="168" height="104" rx="16" style="animation-delay:1.65s"/>
    <text class="num" x="572.0" y="142.0">03</text>
    <text class="bt" x="640" y="174" text-anchor="middle">Qwen3 1.7B</text>
    <text class="bs" x="640" y="198" text-anchor="middle">streaming replies</text>
    <rect class="chip" x="578" y="238.0" width="124" height="26" rx="13"/>
    <text class="ct" x="640" y="255.5" text-anchor="middle">100–200 ms</text>
  </g>
  <g>
    <rect class="box" x="751.0" y="118.0" width="168" height="104" rx="16"/>
    <rect class="lit" x="751.0" y="118.0" width="168" height="104" rx="16" style="animation-delay:2.33s"/>
    <text class="num" x="767.0" y="142.0">04</text>
    <text class="bt" x="835" y="174" text-anchor="middle">Indic Norm</text>
    <text class="bs" x="835" y="198" text-anchor="middle">₹500 → spoken words</text>
    <rect class="chip" x="773" y="238.0" width="124" height="26" rx="13"/>
    <text class="ct" x="835" y="255.5" text-anchor="middle">rule / WFST</text>
  </g>
  <g>
    <rect class="box" x="946.0" y="118.0" width="168" height="104" rx="16"/>
    <rect class="lit" x="946.0" y="118.0" width="168" height="104" rx="16" style="animation-delay:3.02s"/>
    <text class="num" x="962.0" y="142.0">05</text>
    <text class="bt" x="1030" y="174" text-anchor="middle">Svara TTS</text>
    <text class="bs" x="1030" y="198" text-anchor="middle">24 kHz Indic voices</text>
    <rect class="chip" x="968" y="238.0" width="124" height="26" rx="13"/>
    <text class="ct" x="1030" y="255.5" text-anchor="middle">150–300 ms</text>
  </g>

  <g>
    <circle r="14" cy="170" fill="#22D3EE" opacity=".6" filter="url(#blur)">
      <animate attributeName="cx" values="70;1210;1210" keyTimes="0;0.8;1" dur="5.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;.6;0" keyTimes="0;0.8;1" dur="5.0s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" cy="170" fill="#F0FDFF">
      <animate attributeName="cx" values="70;1210;1210" keyTimes="0;0.8;1" dur="5.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="5.0s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>
</svg>
