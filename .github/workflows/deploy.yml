name: Deploy (GCP)

# Manual only: the GPU VM may be stopped, and a first deploy downloads ~25 GB.
# Runs the full CI first, then deploy/gcp/deploy.sh against the existing VM.
#
# Auth is keyless (Workload Identity Federation): GitHub's OIDC token is
# exchanged for short-lived credentials of GCP_SERVICE_ACCOUNT. The provider
# only trusts this repository on refs/heads/main, so run it from main.
#
# Repository variables needed (Settings > Secrets and variables > Actions):
#   GCP_PROJECT_ID       project that holds the VM
#   GCP_WIF_PROVIDER     projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<id>
#   GCP_SERVICE_ACCOUNT  deployer account: Compute Instance Admin (v1) on the VM,
#                        Compute Viewer on the project, Service Account User on
#                        the VM's service account
#   GCP_ZONE             optional, defaults to asia-south1-a
#   GCP_VM_NAME          optional, defaults to voice-agent-gpu
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to GCP VM
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # OIDC token for Workload Identity Federation
    env:
      ZONE: ${{ vars.GCP_ZONE || 'asia-south1-a' }}
      NAME: ${{ vars.GCP_VM_NAME || 'voice-agent-gpu' }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Prepare SSH key for gcloud
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -N "" -q -f ~/.ssh/google_compute_engine

      - name: Check the VM is running
        run: |
          status="$(gcloud compute instances describe "$NAME" --zone "$ZONE" --format='value(status)')"
          echo "VM $NAME is $status"
          if [ "$status" != "RUNNING" ]; then
            echo "::error::Start the VM first: gcloud compute instances start $NAME --zone $ZONE"
            exit 1
          fi

      - name: Deploy
        run: bash deploy/gcp/deploy.sh
