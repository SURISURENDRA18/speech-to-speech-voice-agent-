name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  RUFF_VERSION: "0.16.3"
  TORCH_VERSION: "2.13.0"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install "ruff==${RUFF_VERSION}"

      - run: ruff check voice_agent/ tests/

  test:
    name: Tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: deploy/gcp/requirements-gpu.txt

      - name: Install dependencies
        # Same pins as the GPU image, but CPU-only torch and no CUDA libraries.
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|nvidia-)' deploy/gcp/requirements-gpu.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" pytest pytest-asyncio

      - name: Fetch model assets used by tests
        # Silero VAD weights and Svara voice list, at the paths the code looks for.
        run: |
          mkdir -p silero-vad-master/src/silero_vad/data svara-tts-inference-main/assets/voices
          curl -fsSL -o silero-vad-master/src/silero_vad/data/silero_vad.jit \
            https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.jit
          curl -fsSL -o svara-tts-inference-main/assets/voices/svara-tts-v1.yaml \
            https://raw.githubusercontent.com/Kenpath/svara-tts-inference/main/assets/voices/svara-tts-v1.yaml

      - name: Run tests
        # test_real_smoke.py needs locally cached Qwen3 weights and Apple Silicon.
        env:
          USE_MLX: "false"
        run: python -m pytest tests/ -v --ignore=tests/test_real_smoke.py
